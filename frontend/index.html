<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factoring Application</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <div class="card">
            <h1>Factoring Application</h1>

            <p class="subtitle">
                Submit an invoice factoring application and review the decision.
            </p>

            <form id="application-form">
                <div class="form-group">
                    <label for="application-id">
                        Application ID
                    </label>

                    <input
                        type="text"
                        id="application-id"
                        name="application_id"
                        placeholder="FAC-1001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="customer-id">
                        Customer ID
                    </label>

                    <input
                        type="text"
                        id="customer-id"
                        name="customer_id"
                        placeholder="CUS-101"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="invoice-amount">
                        Invoice Amount (cents)
                    </label>

                    <input
                        type="number"
                        id="invoice-amount"
                        name="invoice_amount_cents"
                        min="1"
                        placeholder="125000"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="requested-advance">
                        Requested Advance (cents)
                    </label>

                    <input
                        type="number"
                        id="requested-advance"
                        name="requested_advance_cents"
                        min="1"
                        placeholder="90000"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="due-date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due-date"
                        name="due_date"
                        required
                    >
                </div>

                <button type="submit">
                    Submit Application
                </button>
            </form>

            <div id="result" class="result" hidden>
                <h2>Application Result</h2>

                <div class="result-row">
                    <span>Application ID</span>
                    <strong id="result-application-id"></strong>
                </div>

                <div class="result-row">
                    <span>Decision</span>
                    <strong
                        id="result-decision"
                        class="decision"
                    ></strong>
                </div>

                <div class="result-row">
                    <span>Requested Advance</span>
                    <strong id="result-requested"></strong>
                </div>

                <div class="result-row">
                    <span>Available Advance</span>
                    <strong id="result-available"></strong>
                </div>

                <div class="result-row">
                    <span>Provider Reference</span>
                    <strong id="result-provider-reference"></strong>
                </div>
            </div>

            <div id="error" class="error" hidden></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
